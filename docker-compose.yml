version: '3.8'

services:
  backend:
    build: .
    image: agentic-research-matrix-backend:latest

    ports:
      - "8000:8000"
    volumes:
      - data_volume:/app/data
    env_file:
      - .env
    environment:
      - CHROMA_PATH=/app/data/chroma_db
      - LOG_LEVEL=INFO
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=password

    depends_on:
      - neo4j
    restart: always

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    restart: always

volumes:
  data_volume:
  neo4j_data:

